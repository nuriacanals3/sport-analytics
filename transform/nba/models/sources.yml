version: 2

sources:
  - name: bronze
    description: "Raw NBA play-by-play JSON files stored in S3 by the ingestion pipeline"
    tables:
      - name: nba_pbp
        description: "One JSON file per game. Path: s3://{S3_BUCKET_NAME}/bronze/nba_pbp/pbp_{game_id}_{date}.json"
      - name: nba_game_log
        description: "One JSON file per season (LeagueGameLog, team rows). Path: s3://{S3_BUCKET_NAME}/bronze/nba_game_log/game_log_{season}.json"
      - name: nba_team_stats
        description: "One JSON file per season per measure type (LeagueDashTeamStats). Path: s3://{S3_BUCKET_NAME}/bronze/nba_team_stats/team_stats_{measure_type}_{season}.json"
